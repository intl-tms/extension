<!--
  The same mark for the 16 and 32 pixel PNGs, where the master's three lines
  and the outline between them merge into one grey smudge. One line of text
  and one outline survive: the page is still a page, and the blue box is still
  the thing around a text.

  Kept as its own file rather than a flag in the master, so what ships at each
  size is something that was looked at.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <clipPath id="frame"><rect width="128" height="128" rx="26" /></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="128" height="128" fill="#0e2a52" />
    <rect x="6" y="8" width="116" height="112" rx="19" fill="#ffffff" />
    <rect x="24" y="28" width="54" height="11" rx="5.5" fill="#aeb6c2" />
    <rect x="20" y="54" width="88" height="38" rx="11" fill="none" stroke="#1a66d6" stroke-width="11" />
  </g>
</svg>
